<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 QA Calendar - Retro Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="calendar-header">
            <h1 class="title">Quality Assurance Calendar 2026</h1>
            <p class="tagline">"Bug-Free Since... Well, We're Working On It"</p>
        </header>

        <div class="year-view" id="yearView">
            <!-- All 12 months will be generated by JavaScript -->
        </div>

        <footer class="footer">
            <p>✦ Quality is not an act, it is a habit ✦</p>
        </footer>
    </div>

    <!-- Modal for viewing/editing notes as todo list -->
    <div id="noteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Notes for Date</h3>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="add-note-section">
                    <input type="text" id="newNoteInput" placeholder="Add new note..." />
                    <button id="addNoteBtn">ADD</button>
                </div>
                <div class="file-upload-section">
                    <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt" multiple style="display: none;" />
                    <button id="uploadFileBtn" class="upload-btn">📎 ATTACH FILE</button>
                </div>
                <div class="options-section">
                    <label class="option-checkbox">
                        <input type="checkbox" id="showNumbering" />
                        <span>Show task numbers</span>
                    </label>
                </div>
                <div id="notesList" class="notes-list">
                    <!-- Notes will be added here dynamically -->
                </div>
                <div id="attachmentsList" class="attachments-list">
                    <!-- Attachments will be shown here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Image preview modal -->
    <div id="imageModal" class="image-modal">
        <span class="image-modal-close" id="imageModalClose">&times;</span>
        <img id="imageModalImg" src="" alt="Preview">
    </div>

    <script src="script.js"></script>
</body>
</html>
